name: Tests and manual report

# The weekly report runs on a self-hosted runner: YouTube answers GitHub-hosted runners with
# "Sign in to confirm you're not a bot". Here, tests run on every push and pull request, and the
# report job is kept for manual runs (it works on GitHub-hosted runners only if YouTube allows it).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: "Videos to measure (empty = top_n from config.yaml)"
        required: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  report:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: without it the Claude step is skipped
        run: python -m trendpattern run --config config.yaml ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Weekly trend report $(date -u +%G-W%V)"
          git push
